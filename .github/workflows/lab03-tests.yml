name: Lab03 tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/lab03/requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r labs/lab03/requirements.txt
      - run: python -m pytest tests -q
        working-directory: labs/lab03
      - run: python labs/lab03/scripts/audit_outputs.py
